<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="whoami.dev terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- terminal window -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bg)" stroke="#3fb950" stroke-width="2"/>

  <!-- title-bar traffic lights -->
  <circle cx="16" cy="15" r="2.6" fill="#ff5f57"/>
  <circle cx="25" cy="15" r="2.6" fill="#febc2e"/>
  <circle cx="34" cy="15" r="2.6" fill="#28c840"/>

  <!-- prompt: >_ -->
  <g filter="url(#glow)">
    <polyline points="17,30 27,39 17,48" fill="none" stroke="#3fb950"
      stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="32" y="43" width="17" height="6" rx="3" fill="#3fb950"/>
  </g>
</svg>
