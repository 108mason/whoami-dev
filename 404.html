<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — command not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d1117;--bg-bar:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#6e7681;--bright:#f0f6fc;--green:#3fb950;--blue:#58a6ff;--red:#f85149;--yellow:#e3b341}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:13px;min-height:100vh}
    .bar{display:flex;align-items:center;gap:8px;background:var(--bg-bar);border-bottom:1px solid var(--border);padding:9px 14px}
    .dot{width:11px;height:11px;border-radius:50%}
    .c{background:var(--red)}.m{background:var(--yellow)}.x{background:var(--green)}
    .bar-title{flex:1;text-align:center;color:var(--dim);font-size:12px}
    main{max-width:760px;margin:0 auto;padding:64px 20px}
    .line{margin-bottom:10px;word-break:break-word}
    .prompt{color:var(--green)}
    .err{color:var(--red)}
    h1{font-size:2.4rem;color:var(--bright);margin:28px 0 10px;letter-spacing:.04em}
    p{color:var(--dim);margin-bottom:28px;line-height:1.7}
    a.home{display:inline-block;color:var(--blue);text-decoration:none;border:1px solid var(--border);padding:9px 16px;transition:background .15s,border-color .15s}
    a.home:hover{background:var(--bg-bar);border-color:var(--blue)}
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XNPK70BE7R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XNPK70BE7R');
  </script>
</head>
<body>
  <div class="bar">
    <span class="dot c"></span><span class="dot m"></span><span class="dot x"></span>
    <span class="bar-title">guest@whoami.dev:~</span>
  </div>
  <main>
    <div class="line"><span class="prompt">guest@whoami.dev:~$</span> <span id="cmd">cat .</span></div>
    <div class="line err">cat: no such file or directory</div>
    <h1>404</h1>
    <p>That path doesn&#39;t exist on this machine.</p>
    <a class="home" href="/">cd ~</a>
  </main>
  <script>
    try{
      var p=location.pathname.replace(/[<>"]/g,'');
      document.getElementById('cmd').textContent='cat '+p;
    }catch(e){}
  </script>
</body>
</html>
